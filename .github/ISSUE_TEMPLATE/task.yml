name: 작업 (Task)
description: 결정이 끝나 바로 구현할 수 있는 작업을 등록합니다.
title: "[task] "
labels: ["wf:task"]
body:
  - type: markdown
    attributes:
      value: |
        결정되지 않은 것을 작업 이슈로 만들지 마세요. 먼저 결정 이슈로 등록합니다.
  - type: input
    id: decision-ref
    attributes:
      label: 근거가 되는 결정 이슈
      description: 이 작업의 근거가 된 결정 이슈 번호를 씁니다.
      placeholder: "#12"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 수락 기준
      description: 검증자가 그대로 확인할 수 있도록 관찰 가능한 문장으로 씁니다.
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: 검증 명령
      description: 복붙 실행 가능한 명령만 적습니다.
      value: |
        cd seed && npm test && cd ..
        ./scripts/check-repo.sh
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: 하네스 / 모델
      options:
        - Copilot / Claude Opus 5
        - Copilot / GPT-5.6 Sol
        - Copilot / GPT-5.6 Terra
        - Claude 하네스
        - Codex 하네스
        - Cloud 에이전트
    validations:
      required: true
