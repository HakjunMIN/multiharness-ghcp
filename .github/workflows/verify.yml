name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        # macOS는 Bash 3.2와 참가자 실제 환경을 지키기 위해 남긴다.
        # Node는 최소 지원 버전 하나만 검증한다.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: API dependencies
        run: uv sync --frozen
        working-directory: app/api
        env:
          UV_DEFAULT_INDEX: https://packagefeedproxy.microsoft.io/pypi/simple
      - name: API tests
        run: uv run --frozen pytest -q
        working-directory: app/api
      - name: Web tests and build
        run: npm ci && npm test && npm run build
        working-directory: app/web
      - name: repo asset gate
        run: ./scripts/check-repo.sh
      - name: shell behavior tests
        run: for test in tests/scripts/test-*.sh; do "$test"; done
      - name: participant bundle boundary
        run: |
          bundle="${RUNNER_TEMP}/workshop-participant.tar.gz"
          ./scripts/build-participant-bundle.sh "$bundle" --confirm
          ! tar -tzf "$bundle" | grep -Eq '(^|/)\.env$'
