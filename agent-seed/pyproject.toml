[project]
name = "hanbit-consult"
version = "0.1.0"
description = "웹검색으로 지식을 찾아 제품 문의에 답하는 상담 에이전트. 워크샵 과제의 출발점."
requires-python = ">=3.11"
dependencies = [
    "agent-framework-core==1.14.0",
    "agent-framework-openai==1.13.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hanbit_consult"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
