[project]
name = "consult-runway"
version = "0.1.0"
description = "Greenfield workshop API runway"
requires-python = ">=3.11"
dependencies = [
    "agent-framework-core==1.14.0",
    "agent-framework-openai==1.13.0",
    "azure-search-documents==11.6.0",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "pydantic-settings==2.10.1",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consult"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-m", "not live"]
markers = [
    "live: calls the instructor APIM and requires workshop credentials",
]
